name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux-gcc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
        include:
          - build_type: Debug
            extra_flags: -DCMQ_ENABLE_ASAN=ON -DCMQ_ENABLE_UBSAN=ON
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.extra_flags }}
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)

  build-linux-clang:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Configure
        run: CC=clang cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMQ_ENABLE_ASAN=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        working-directory: build
        run: ctest --output-on-failure --parallel $(nproc)

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-compiler and arm64 libraries
        run: |
          sudo dpkg --add-architecture arm64
          # Keep the default sources amd64-only and add the arm64 ports mirror.
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources > /dev/null <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config gcc-aarch64-linux-gnu \
            libssl-dev:arm64 libzstd-dev:arm64 zlib1g-dev:arm64
      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMQ_BUILD_EXAMPLES=OFF
      - name: Build
        run: cmake --build build --parallel $(nproc)

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMQ_ENABLE_TSAN=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test (focused)
        working-directory: build
        run: ctest --output-on-failure -j1 -R "queue|parser|sublist|slab|stress|server_ops"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake gcc gcovr
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMQ_ENABLE_COVERAGE=ON
      - name: Build
        run: cmake --build build --parallel $(nproc)
      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j1
      - name: Report coverage
        working-directory: build
        # gcov can emit negative branch counts for multithreaded code
        # (https://gcc.gnu.org/bugzilla/show_bug.cgi?id=68080); gcovr aborts on them
        # unless told to warn instead.
        run: gcovr --root .. --filter '.*/src/.*' --print-summary --xml coverage.xml --gcov-ignore-parse-errors negative_hits.warn_once_per_file
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/coverage.xml
